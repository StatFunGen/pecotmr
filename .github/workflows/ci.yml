name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - .gitignore
      - README.md

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }} (${{ matrix.platform }} / ${{ matrix.environment }})
    runs-on: ${{ matrix.runner }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Run unit tests, task: devtools_test, platform: linux-aarch64, runner: ubuntu-24.04-arm, environment: r45 }
          - { name: Run unit tests, task: devtools_test, platform: osx-arm64, runner: macos-latest, environment: r45 }
          - { name: Run unit tests, task: devtools_test, platform: linux-64, -aarch64, runner: ubuntu-24.04-arm, environment: r45 }
          - { name: Check code coverage with covr, task: codecov, platform: linux-64, runner: ubuntu-latest, environment: r45 }
          - { name: Run R CMD check, task: rcmdcheck, platform: linux-64, runner: ubuntu-latest, environment: r45 }
          - { name: Run BiocCheckGitClone, task: bioccheck_git_clone, platform: linux-64, runner: ubuntu-latest, environment: r45 }
          - { name: Run BiocCheck, task: bioccheck, platform: linux-64, runner: ubuntu-latest, environment: r45 }
          - { name: Check goodpractice, task: goodpractice, platform: linux-64, runner: ubuntu-latest, environment: r45 }
          - { name: Check pkgdown_build, task: pkgdown_build, platform: linux-64, runner: ubuntu-latest, environment: r45 }
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create TOML from recipe
        run: |
          .github/workflows/create_toml_from_yaml.sh ${GITHUB_WORKSPACE}
          mkdir -p /tmp/pixi
          mv ${GITHUB_WORKSPACE}/pixi.toml /tmp/pixi

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          manifest-path: /tmp/pixi/pixi.toml

      - name: Allow post-link scripts
        run: pixi config set --manifest-path /tmp/pixi/pixi.toml --local run-post-link-scripts insecure

      - name: ${{ matrix.name }}
        run: pixi run --environment ${{ matrix.environment }} --manifest-path /tmp/pixi/pixi.toml ${{ matrix.task }}
