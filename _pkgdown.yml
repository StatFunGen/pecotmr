      - RangedTupleList-class
      - SldscData-class
      - SumStatsBase-class
      - TwasWeights-class
      - TwasWeightsRow-class

  - title: "Class constructors"
    desc: >
      User-facing constructors. For classes that have both a `-class`
      topic and a constructor topic, prefer the constructor for
      day-to-day use; the `-class` topic is the authoritative slot
      reference.
    contents:
      - AnnotationMatrix
      - CtwasResult
      - ColocBoostResult
      - ColocResult
      - CtwasResultEntry
      - fineMappingRow
      - GwasFineMappingResult
      - GwasSumStats
      - LdData
      - LdEigen
      - LdScore
      - MashPrior
      - MultiStudyQtlDataset
      - QtlDataset
      - QtlFineMappingResult
      - QtlSumStats
      - qtlSumStatsFromBetaMatrix
      - qtlSumStatsFromZMatrix
      - SldscData
      - TwasWeights
      - twasWeightsRow

  - title: "Manifest loaders"
    desc: >
      Build the individual-level and summary-statistic containers from a
      manifest (a data.frame or a delimited file) that points at the
      phenotype / genotype / summary-statistic sources.
    contents:
      - loadQtlDatasetFromManifest
      - loadMultiStudyQtlDatasetFromManifest
      - loadQtlSumStatsFromManifest
      - loadGwasSumStatsFromManifest

  - title: "Class methods"
    desc: >
      Accessor and behaviour methods grouped by the class they're
      defined on. Generics with implementations on multiple classes
      appear under each. S4 pipeline dispatch methods
      (`fineMappingPipeline`, `colocboostPipeline`,
      `twasWeightsPipeline`) are listed under "Pipelines" further
      down rather than repeated per class.
    contents:
      - show-methods

