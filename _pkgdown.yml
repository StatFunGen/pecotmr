      - ctwasInputsExample
      - ctwasEstExample
      - ctwasFinemapExample
      # mash
      - mashInputExample
      - mashPosteriorExample
      # LD references and heritability
      - ldEigenExample
      - ldScoreExample
      - h2EstimateExample

  - title: internal
    desc: >
      Implementation details that have `.Rd` topics but no front-facing
      role. Hidden from the reference index but still searchable and
      rendered.
    contents:
