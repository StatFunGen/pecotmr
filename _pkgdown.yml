      - waldTestPval

  - title: "mash"
    desc: >
      The mash (multivariate adaptive shrinkage) track: the chainable steps
      \code{mashInput} -> \code{mashResidualCorrelation} ->
      \code{mashPriorCovariances} (or \code{mashCovarianceComponents}) ->
      \code{mashModelFit} -> \code{mashPosterior} that \code{mashPipeline} is
      built from, the posterior-contrast + feature-score layer, and the
      supporting utilities for contrast construction and meta-analysis.
    contents:
      - mashInput
      - mashResidualCorrelation
      - mashCovarianceComponents
      - mashPriorCovariances
      - mashModelFit
      - mashPosterior
      - mashPosteriorContrast
      - calculateFeatureScores
      - nSignificantScore
      - scoreFromCs
      - makePairwiseContrastCol
      - fitMashContrast
      - metaAnalysisPerCondition
      - filterInvalidSummaryStat
      - filterMixtureComponents
      - mashRandNullSample
      - mergeMashData
      - sanitizeMashData
      - sliceMashData
      - updateMashModelCov

  - title: "Heritability and enrichment"
    desc: >
      Heritability estimation, LD-score computation, stratified
      LD-score regression utilities, and per-variant QTL/GWAS
      enrichment analysis (low-level kernel that powers
      \code{qtlEnrichmentPipeline}).
    contents:
      - estimateH2
      - computeLdScores
      - computeSldscAnnotSd
      - computeSldscMRef
      - readAnnotations
      - readSldscTrait
      - readSldscAnnot
