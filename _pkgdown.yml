  - title: "Bundled example datasets"
    desc: >
      Synthetic data shipped with the package for vignettes and
      tests. Their bundled genotype-panel paths resolve to the installed
      `inst/extdata/` location automatically at extraction time.
    contents:
      # S4 input containers
      - qtlDatasetExample
